<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZCater Order Heatmap (anonymized demo)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Courier New', monospace; background: #0d0d0d; color: #e8e0d0; height: 100vh; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #topbar { background: #111; border-bottom: 1px solid #2a2416; padding: 10px 16px; display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
  #topbar h1 { font-size: 13px; font-weight: bold; letter-spacing: 3px; color: #f5a623; text-transform: uppercase; }
  .stat { font-size: 11px; color: #888; letter-spacing: 1px; }
  .stat span { color: #f5a623; font-weight: bold; }
  #tab-bar { display: flex; background: #111; border-bottom: 1px solid #2a2416; flex-shrink: 0; }
  .tab-btn { flex: 1; padding: 9px 12px; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; background: none; border: none; border-bottom: 2px solid transparent; color: #666; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
  .tab-btn:hover { color: #aaa; }
  .tab-btn.active { color: #f5a623; border-bottom-color: #f5a623; }
  #content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  #view-map { display: flex; flex-direction: column; flex: 1; overflow: hidden; position: relative; }
  #view-orders, #view-headcount { display: none; flex-direction: column; flex: 1; overflow: hidden; background: #0d0d0d; }
  #view-orders.active, #view-headcount.active { display: flex; }
  #map-wrap { position: relative; flex: 1; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 0; right: 0; width: 340px; height: 100%; background: rgba(10,8,5,0.97); border-left: 1px solid #2a2416; transform: translateX(100%); transition: transform 0.28s cubic-bezier(.4,0,.2,1); overflow: hidden; display: flex; flex-direction: column; z-index: 1000; }
  #panel.open { transform: translateX(0); }
  #panel-header { padding: 14px 16px 10px; border-bottom: 1px solid #2a2416; flex-shrink: 0; }
  #panel-close { position: absolute; top: 12px; right: 12px; background: none; border: none; color: #666; cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; }
  #panel-close:hover { color: #f5a623; }
  #panel-addr { font-size: 11px; color: #888; letter-spacing: 0.5px; margin-top: 4px; line-height: 1.4; }
  #panel-company { font-size: 15px; color: #f5a623; font-weight: bold; letter-spacing: 1px; }
  #panel-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #2a2416; flex-shrink: 0; }
  .pstat { background: #161208; border: 1px solid #2a2416; border-radius: 4px; padding: 8px 10px; }
  .pstat-label { font-size: 9px; letter-spacing: 1.5px; color: #666; text-transform: uppercase; }
  .pstat-val { font-size: 18px; color: #f5a623; font-weight: bold; margin-top: 2px; }
  #orders-list { overflow-y: auto; flex: 1; padding: 0; }
  #orders-list::-webkit-scrollbar { width: 4px; }
  #orders-list::-webkit-scrollbar-track { background: #0a0805; }
  #orders-list::-webkit-scrollbar-thumb { background: #2a2416; }
  .order-row { border-bottom: 1px solid #1a1208; padding: 10px 16px; cursor: default; }
  .order-row:hover { background: #161208; }
  .order-num { font-size: 10px; letter-spacing: 2px; color: #f5a623; }
  .order-co { font-size: 12px; color: #e8e0d0; margin: 3px 0 2px; font-weight: bold; }
  .order-meta { display: flex; gap: 12px; font-size: 10px; color: #888; }
  .tag { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 2px; letter-spacing: 0.5px; }
  .tag-new { background: #1a2a1a; color: #4a9; border: 1px solid #2a3a2a; }
  .tag-rep { background: #2a2010; color: #c84; border: 1px solid #3a3010; }
  #legend { position: absolute; bottom: 16px; left: 16px; background: rgba(10,8,5,0.9); border: 1px solid #2a2416; border-radius: 4px; padding: 10px 14px; z-index: 500; }
  #legend h4 { font-size: 9px; letter-spacing: 2px; color: #666; margin-bottom: 8px; }
  .leg-bar { width: 160px; height: 8px; border-radius: 2px; background: linear-gradient(to right, rgba(0,100,255,0.3), rgba(0,255,100,0.5), rgba(255,200,0,0.7), rgba(255,80,0,0.9), rgba(255,0,0,1)); margin-bottom: 4px; }
  .leg-labels { display: flex; justify-content: space-between; font-size: 9px; color: #666; }
  #hint { position: absolute; bottom: 16px; right: 16px; background: rgba(10,8,5,0.85); border: 1px solid #2a2416; border-radius: 4px; padding: 8px 12px; font-size: 10px; color: #666; letter-spacing: 0.5px; z-index: 500; }
  .leaflet-container { background: #e8e4dc; }
  .loc-marker { width: 12px; height: 12px; border-radius: 50%; background: rgba(245,166,35,0.4); border: 1px solid rgba(245,166,35,0.8); cursor: pointer; transition: transform 0.15s; }
  .loc-marker:hover { transform: scale(1.6); background: rgba(245,166,35,0.7); }
  .loc-marker.multi { background: rgba(245,80,20,0.5); border-color: rgba(255,120,40,0.9); }
  #orders-header { padding: 8px 16px 6px; font-size: 9px; letter-spacing: 2px; color: #555; border-bottom: 1px solid #1a1208; flex-shrink: 0; }
  .rank-table { overflow-y: auto; flex: 1; }
  .rank-table::-webkit-scrollbar { width: 4px; }
  .rank-table::-webkit-scrollbar-track { background: #0a0805; }
  .rank-table::-webkit-scrollbar-thumb { background: #2a2416; }
  .table-header { padding: 8px 16px; font-size: 9px; letter-spacing: 2px; color: #555; border-bottom: 1px solid #2a2416; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .th-rank { width: 24px; text-align: right; flex-shrink: 0; }
  .th-main { flex: 1; }
  .th-val { width: 60px; text-align: right; flex-shrink: 0; }
  .th-rev { width: 72px; text-align: right; flex-shrink: 0; }
  .rank-row { display: flex; align-items: center; padding: 9px 16px; border-bottom: 1px solid #1a1208; gap: 10px; cursor: pointer; }
  .rank-row:hover { background: #161208; }
  .rank-num { font-size: 11px; color: #444; width: 24px; flex-shrink: 0; text-align: right; }
  .rank-info { flex: 1; min-width: 0; }
  .rank-company { font-size: 12px; color: #e8e0d0; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-addr { font-size: 10px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .rank-bar-bg { height: 3px; background: #1a1208; border-radius: 2px; margin-top: 4px; }
  .rank-bar-fill { height: 3px; border-radius: 2px; background: #f5a623; }
  .rank-val { font-size: 15px; color: #f5a623; font-weight: bold; flex-shrink: 0; width: 36px; text-align: right; }
  .rank-rev { font-size: 11px; color: #888; flex-shrink: 0; width: 72px; text-align: right; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>EZCater Order Map</h1>
    <div class="stat">Locations: <span id="s-loc">—</span></div>
    <div class="stat">Total Orders: <span id="s-ord">—</span></div>
    <div class="stat">Total Revenue: <span id="s-rev">—</span></div>
    <div class="stat">Avg Headcount: <span id="s-hc">—</span></div>
  </div>
  <div id="tab-bar">
    <button class="tab-btn active" onclick="switchTab('map')">Map</button>
    <button class="tab-btn" onclick="switchTab('orders')">Orders by Count</button>
    <button class="tab-btn" onclick="switchTab('headcount')">Orders by Headcount</button>
  </div>
  <div id="content">
    <div id="view-map">
      <div id="map-wrap">
        <div id="map"></div>
        <div id="panel">
          <button id="panel-close" onclick="closePanel()">&#x2715;</button>
          <div id="panel-header">
            <div id="panel-company">—</div>
            <div id="panel-addr">—</div>
          </div>
          <div id="panel-stats">
            <div class="pstat"><div class="pstat-label">Orders</div><div class="pstat-val" id="ps-count">—</div></div>
            <div class="pstat"><div class="pstat-label">Headcount</div><div class="pstat-val" id="ps-hc">—</div></div>
            <div class="pstat"><div class="pstat-label">Revenue</div><div class="pstat-val" id="ps-rev">—</div></div>
          </div>
          <div id="orders-header">ORDER DETAILS</div>
          <div id="orders-list"></div>
        </div>
        <div id="legend">
          <h4>ORDER DENSITY</h4>
          <div class="leg-bar"></div>
          <div class="leg-labels"><span>Low</span><span>High</span></div>
        </div>
        <div id="hint">Click any marker to view orders</div>
      </div>
    </div>

    <div id="view-orders">
      <div class="table-header">
        <div class="th-rank">#</div>
        <div class="th-main">COMPANY / ADDRESS</div>
        <div class="th-val">ORDERS</div>
        <div class="th-rev">REVENUE</div>
      </div>
      <div class="rank-table" id="orders-rank"></div>
    </div>

    <div id="view-headcount">
      <div class="table-header">
        <div class="th-rank">#</div>
        <div class="th-main">COMPANY / ADDRESS</div>
        <div class="th-val">HEADCOUNT</div>
        <div class="th-rev">REVENUE</div>
      </div>
      <div class="rank-table" id="hc-rank"></div>
    </div>
  </div>
</div>

const totalOrders = DATA.reduce((s,d)=>s+d.count,0);
const totalRev = DATA.reduce((s,d)=>s+d.total_food,0);
const allHC = DATA.flatMap(d=>d.orders.map(o=>o.headcount)).filter(h=>h>0);
const avgHC = allHC.length ? allHC.reduce((a,b)=>a+b,0)/allHC.length : 0;
document.getElementById('s-loc').textContent = DATA.length;
document.getElementById('s-ord').textContent = totalOrders;
document.getElementById('s-rev').textContent = '$' + totalRev.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
document.getElementById('s-hc').textContent = Math.round(avgHC);

const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([45.03, -93.38], 11);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, attribution: 'Tiles &copy; Esri'
}).addTo(map);

const maxCount = Math.max(...DATA.map(d=>d.count));
const heatPoints = DATA.map(d => [d.lat, d.lng, d.count / maxCount]);
L.heatLayer(heatPoints, {
  radius: 38, blur: 28, maxZoom: 14, max: 1.0,
  gradient: {0.2:'#1a4a8a', 0.4:'#0f6e56', 0.6:'#ba7517', 0.8:'#d85a30', 1.0:'#e24b4a'}
}).addTo(map);

DATA.forEach(loc => {
  const icon = L.divIcon({
    className: '',
    html: `<div class="loc-marker${loc.count>1?' multi':''}"></div>`,
    iconSize: [12,12], iconAnchor: [6,6]
  });
  const marker = L.marker([loc.lat, loc.lng], {icon}).addTo(map);
  marker.on('click', () => { switchTab('map'); openPanel(loc); });
});

function fmt$(v){ return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function getLabel(loc) {
  const cos = loc.companies.filter(Boolean);
  return cos.length ? cos[0] : (loc.orders[0]?.company || 'Anonymized customer');
}

function openPanel(loc) {
  const mainCo = getLabel(loc);
  document.getElementById('panel-company').textContent = mainCo || 'Anonymized customer';
  document.getElementById('panel-addr').textContent = loc.address;
  document.getElementById('ps-count').textContent = loc.count;
  document.getElementById('ps-hc').textContent = loc.total_headcount || '—';
  document.getElementById('ps-rev').textContent = fmt$(loc.total_food);
  const list = document.getElementById('orders-list');
  list.innerHTML = loc.orders.map(o => {
    const co = o.company || mainCo || 'Anonymized customer';
    const isNew = o.customer_type === 'New Customer';
    return `<div class="order-row">
      <div class="order-num">${o.order} <span class="tag ${isNew?'tag-new':'tag-rep'}">${isNew?'NEW':'REPEAT'}</span></div>
      <div class="order-co">${co}</div>
      <div class="order-meta"><span>HC: ${o.headcount||'N/A'}</span><span>Rev: ${fmt$(o.food_total)}</span></div>
    </div>`;
  }).join('');
  document.getElementById('panel').classList.add('open');
  document.getElementById('hint').style.display = 'none';
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('hint').style.display = 'block';
}

map.on('click', e => { if(!e.originalEvent.target.closest('#panel')) closePanel(); });

function buildRankTable(containerId, sorted, valKey, valLabel) {
  const container = document.getElementById(containerId);
  const maxVal = sorted[0][valKey] || 1;
  container.innerHTML = sorted.map((loc, i) => {
    const label = getLabel(loc);
    const val = loc[valKey];
    const pct = Math.round((val / maxVal) * 100);
    return `<div class="rank-row" onclick="jumpToLoc(${DATA.indexOf(loc)})">
      <div class="rank-num">${i+1}</div>
      <div class="rank-info">
        <div class="rank-company">${label || 'Anonymized customer'}</div>
        <div class="rank-addr">${loc.address}</div>
        <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="rank-val">${val}</div>
      <div class="rank-rev">${fmt$(loc.total_food)}</div>
    </div>`;
  }).join('');
}

const byOrders = [...DATA].sort((a,b) => b.count - a.count);
const byHC = [...DATA].sort((a,b) => b.total_headcount - a.total_headcount);
buildRankTable('orders-rank', byOrders, 'count', 'Orders');
buildRankTable('hc-rank', byHC, 'total_headcount', 'Headcount');

function jumpToLoc(idx) {
  switchTab('map');
  const loc = DATA[idx];
  map.setView([loc.lat, loc.lng], 14, {animate: true});
  setTimeout(() => openPanel(loc), 350);
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['map','orders','headcount'][i] === tab);
  });
  document.getElementById('view-map').style.display = tab === 'map' ? 'flex' : 'none';
  document.getElementById('view-orders').classList.toggle('active', tab === 'orders');
  document.getElementById('view-headcount').classList.toggle('active', tab === 'headcount');
  if(tab === 'map') setTimeout(() => map.invalidateSize(), 50);
}
</script>
</body>
</html>
